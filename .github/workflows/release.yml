name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v10). Created on the selected branch if missing.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build module zip
        run: |
          git archive --format=zip -o "magisk-module-wifi7-${{ steps.tag.outputs.name }}.zip" HEAD -- \
            META-INF action.sh customize.sh initrc module.prop post-fs-data.sh service.sh \
            system system.prop uninstall.sh xml README.md
          unzip -l magisk-module-wifi7-*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" magisk-module-wifi7-*.zip \
            --target "${{ github.sha }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes
